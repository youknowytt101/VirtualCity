<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill:#f8fafc; }
      .panel { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.2; }
      .h1 { fill:#0f172a; font-size:30px; font-weight:750; }
      .sub { fill:#475569; font-size:13px; }
      .tiny { fill:#64748b; font-size:11px; }
      .phaseTitle { fill:#0f172a; font-size:21px; font-weight:750; }
      .phaseSub { fill:#334155; font-size:13px; font-weight:700; }
      .label { fill:#475569; font-size:12px; }
      .step { fill:#0f172a; font-size:13px; font-weight:700; }
      .note { fill:#475569; font-size:12px; }
      .data { fill:#dbeafe; stroke:#2563eb; }
      .cache { fill:#ccfbf1; stroke:#0d9488; }
      .clean { fill:#dcfce7; stroke:#16a34a; }
      .qa { fill:#ede9fe; stroke:#7c3aed; }
      .houdini { fill:#ffedd5; stroke:#ea580c; }
      .export { fill:#fce7f3; stroke:#db2777; }
      .warn { fill:#fef3c7; stroke:#d97706; }
      .flow { stroke:#334155; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:1.7; fill:none; stroke-dasharray:7 5; marker-end:url(#arrow); }
      .divider { stroke:#cbd5e1; stroke-width:1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="980"/>

  <text x="40" y="52" class="h1">VirtualCity 自动化管线：三大模块总览</text>
  <text x="42" y="80" class="sub">总架构抽象：数据获取/下载/缓存 → 数据清洗/语义/QA → Houdini 构建/Model QA/审核出口</text>
  <text x="42" y="102" class="tiny">这张图是最高层架构图；详细排查见 VirtualCity_自动化管线完整流程图.svg。</text>

  <!-- Phase 1 -->
  <g transform="translate(40,150)">
    <rect class="panel" x="0" y="0" width="430" height="650" rx="16"/>
    <rect x="0" y="0" width="430" height="74" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="24" y="34" class="phaseTitle">一、数据获取 / 下载 / 缓存</text>
    <text x="24" y="56" class="phaseSub">目标：把 bbox 对应的原始城市数据稳定拿到本地</text>

    <rect class="data" x="24" y="100" width="382" height="86" rx="10"/>
    <text x="44" y="127" class="step">入口策略</text>
    <text x="44" y="150" class="note">area_picker 网页选择 1km UTM 网格；set_area 接收 bbox。</text>
    <text x="44" y="170" class="note">每次生成 run_id，写 active_area 与 pipeline_runs。</text>

    <rect class="data" x="24" y="210" width="382" height="114" rx="10"/>
    <text x="44" y="237" class="step">外部数据源策略</text>
    <text x="44" y="260" class="note">道路：OpenStreetMap / Overpass highway ways。</text>
    <text x="44" y="280" class="note">建筑：Overture Maps；高度不足时 join Google Open Buildings。</text>
    <text x="44" y="300" class="note">地形：FABDEM 30m DTM 优先；NASADEM/SRTM 兜底。</text>

    <rect class="cache" x="24" y="348" width="382" height="126" rx="10"/>
    <text x="44" y="375" class="step">缓存策略</text>
    <text x="44" y="398" class="note">先查 _clip_cache：bbox + source_signature 一致则恢复三类数据。</text>
    <text x="44" y="418" class="note">再查 _tile_cache：从大瓦片裁 OSM / DEM / 建筑。</text>
    <text x="44" y="438" class="note">仍缺失才联网下载，并写回 RawData 与 clip cache。</text>
    <text x="44" y="458" class="note">/download-data 只到这里结束，不触发清洗和 Houdini。</text>

    <rect class="warn" x="24" y="498" width="382" height="102" rx="10"/>
    <text x="44" y="525" class="step">输出与门禁</text>
    <text x="44" y="548" class="note">输出：RawData/OSM、RawData/Overture、RawData/DEM。</text>
    <text x="44" y="568" class="note">记录：dem_source、sources、run_id、bbox。</text>
    <text x="44" y="588" class="note">远程失败且无缓存时，pipeline_state 标记 failed。</text>
  </g>

  <!-- Phase 2 -->
  <g transform="translate(535,150)">
    <rect class="panel" x="0" y="0" width="430" height="650" rx="16"/>
    <rect x="0" y="0" width="430" height="74" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="24" y="34" class="phaseTitle">二、数据清洗 / 语义 / QA</text>
    <text x="24" y="56" class="phaseSub">目标：把原始数据变成 Houdini 可稳定消费的标准输入</text>

    <rect class="cache" x="24" y="100" width="382" height="88" rx="10"/>
    <text x="44" y="127" class="step">原始快照策略</text>
    <text x="44" y="150" class="note">refine_data 先复制到 RawData/_downloads/{area}。</text>
    <text x="44" y="170" class="note">清洗只处理工作副本，原始输入保持可追溯。</text>

    <rect class="clean" x="24" y="212" width="382" height="128" rx="10"/>
    <text x="44" y="239" class="step">分级清洗策略</text>
    <text x="44" y="262" class="note">建筑：过滤噪声、近重复、修正 height，补 height_source。</text>
    <text x="44" y="282" class="note">道路：2.5D 清洗、交点分割、链式合并、road_graph。</text>
    <text x="44" y="302" class="note">地形：FABDEM 跳过 DTM 修正；DSM 兜底才做 DTM 修正。</text>
    <text x="44" y="322" class="note">清洗 fingerprint 命中时恢复 _clean_cache_index。</text>

    <rect class="clean" x="24" y="364" width="382" height="88" rx="10"/>
    <text x="44" y="391" class="step">权威模块策略</text>
    <text x="44" y="414" class="note">vc_geo 是 WGS84 / local / Houdini 坐标唯一权威。</text>
    <text x="44" y="434" class="note">vc_schema 检查建筑属性、height provenance、道路连通性。</text>

    <rect class="qa" x="24" y="476" width="382" height="124" rx="10"/>
    <text x="44" y="503" class="step">发布与 QA 策略</text>
    <text x="44" y="526" class="note">先写 staging；跑 InputQA、ProcessQA、OutputQA。</text>
    <text x="44" y="546" class="note">0 fail 才替换 RawData/_houdini_ready/{area}。</text>
    <text x="44" y="566" class="note">fail 时保留上一版 Houdini-ready 数据。</text>
    <text x="44" y="586" class="note">meta.json 绑定 area_id、run_id、schema_version。</text>
  </g>

  <!-- Phase 3 -->
  <g transform="translate(1030,150)">
    <rect class="panel" x="0" y="0" width="430" height="650" rx="16"/>
    <rect x="0" y="0" width="430" height="74" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="24" y="34" class="phaseTitle">三、Houdini 构建 / QA / 出口</text>
    <text x="24" y="56" class="phaseSub">目标：把 Houdini-ready 数据构建成可审核的 OUT_city</text>

    <rect class="houdini" x="24" y="100" width="382" height="106" rx="10"/>
    <text x="44" y="127" class="step">构建前策略</text>
    <text x="44" y="150" class="note">_recook_new_area 检查 _houdini_ready 是否属于当前 run。</text>
    <text x="44" y="170" class="note">未发布或 run_id 不匹配时，先自动跑 refine_data。</text>
    <text x="44" y="190" class="note">Houdini build_status 先写 running。</text>

    <rect class="houdini" x="24" y="230" width="382" height="136" rx="10"/>
    <text x="44" y="257" class="step">Houdini 生成策略</text>
    <text x="44" y="280" class="note">RPYC 连接 localhost:18811；加载 master HIP。</text>
    <text x="44" y="300" class="note">外置 houdini_sops/*.py / *.vex 注入 SOP 节点。</text>
    <text x="44" y="320" class="note">道路、建筑、地形各自构建，再 merge_all → OUT_city。</text>
    <text x="44" y="340" class="note">保存 master HIP，并复制区域 archive HIP。</text>

    <rect class="qa" x="24" y="390" width="382" height="108" rx="10"/>
    <text x="44" y="417" class="step">Model QA 策略</text>
    <text x="44" y="440" class="note">quick QA 检查 required_nodes、terrain_density、building_fit。</text>
    <text x="44" y="460" class="note">道路检查 road_faces、road_clipped_faces、terrain_fit、junction_quality。</text>
    <text x="44" y="480" class="note">fail 阻断；warn 表示完成但需要人工审核。</text>

    <rect class="export" x="24" y="522" width="382" height="78" rx="10"/>
    <text x="44" y="549" class="step">出口策略</text>
    <text x="44" y="572" class="note">pipeline_status.export_gate 校验同 run 状态、QA、人工审核、live OUT_city。</text>
    <text x="44" y="592" class="note">网页导出只 --fbx-only；UE5 导入是人工审核后的后置动作。</text>
  </g>

  <!-- Main arrows -->
  <path class="flow" d="M470,475 C500,475 505,475 535,475"/>
  <path class="flow" d="M965,475 C995,475 1000,475 1030,475"/>

  <!-- Bottom artifacts -->
  <g transform="translate(40,835)">
    <rect class="panel" x="0" y="0" width="1420" height="96" rx="14"/>
    <text x="22" y="30" class="phaseSub">三大模块之间的核心交接产物</text>
    <line class="divider" x1="22" y1="46" x2="1398" y2="46"/>
    <text x="22" y="72" class="label">模块一 → 模块二：RawData/OSM/*.osm、RawData/Overture/*.geojson、RawData/DEM/*.csv、Config/active_area.json、Reports/pipeline_runs/*.json</text>
    <text x="22" y="92" class="label">模块二 → 模块三：RawData/_houdini_ready/{area}/buildings.geojson、roads.osm、dem.csv、road_graph.json、meta.json</text>
  </g>
</svg>
