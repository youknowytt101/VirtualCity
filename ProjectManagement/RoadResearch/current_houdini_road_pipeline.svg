<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .laneTitle { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .nodeTitle { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .nodeText { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .code { font: 600 13px Consolas, "Microsoft YaHei", monospace; fill: #0f172a; }
      .done { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .warn { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .houdini { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .next { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 5; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .softArrow { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 4; }
      .badgeDone { fill: #16a34a; }
      .badgeWarn { fill: #d97706; }
      .badgeNext { fill: #64748b; }
      .badgeText { font: 700 12px "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1180"/>

  <text class="title" x="52" y="56">当前 Houdini 道路测试管线</text>
  <text class="subtitle" x="52" y="88">样本：pattaya_central_500m。上半部分是 Python 数据加工，下半部分是 Houdini 里看到的节点和输出。</text>
  <text class="small" x="52" y="114">依据最新管线报告：road graph 233 nodes / 243 edges，lane graph 612 lanes / 253 laneLinks，lane surface v1 907 faces。</text>

  <rect class="panel" x="40" y="145" width="1600" height="382" rx="14"/>
  <text class="laneTitle" x="70" y="183">A. Houdini 之前：把地图道路整理成可用的车道数据</text>
  <text class="small" x="70" y="208">这一段都在 road_test_pipeline/scripts 里跑，目的是把免费 OSM 中心线变成稳定的 road_graph、路口语义和 lane_graph。</text>

  <!-- Data pipeline nodes -->
  <rect class="warn" x="70" y="245" width="185" height="118" rx="10"/>
  <circle class="badgeWarn" cx="92" cy="268" r="14"/><text class="badgeText" x="88" y="273">1</text>
  <text class="nodeTitle" x="115" y="273">原始地图道路</text>
  <text class="nodeText" x="90" y="303">从 Overpass/OSM 拿到</text>
  <text class="nodeText" x="90" y="325">44 条道路线。</text>
  <text class="nodeText" x="90" y="347">宽度和转向信息缺很多。</text>

  <path class="arrow" d="M 255 304 L 304 304"/>

  <rect class="done" x="304" y="245" width="190" height="118" rx="10"/>
  <circle class="badgeDone" cx="326" cy="268" r="14"/><text class="badgeText" x="322" y="273">2</text>
  <text class="nodeTitle" x="350" y="273">拓扑修复</text>
  <text class="nodeText" x="324" y="303">吸附断点、清短边，</text>
  <text class="nodeText" x="324" y="325">把道路切成 243 条</text>
  <text class="nodeText" x="324" y="347">可连接的简单边。</text>

  <path class="arrow" d="M 494 304 L 543 304"/>

  <rect class="done" x="543" y="245" width="190" height="118" rx="10"/>
  <circle class="badgeDone" cx="565" cy="268" r="14"/><text class="badgeText" x="561" y="273">3</text>
  <text class="nodeTitle" x="589" y="273">道路图</text>
  <text class="nodeText" x="563" y="303">每条路是 edge，</text>
  <text class="nodeText" x="563" y="325">端点/路口是 node。</text>
  <text class="nodeText" x="563" y="347">49 个路口节点。</text>

  <path class="arrow" d="M 733 304 L 782 304"/>

  <rect class="done" x="782" y="245" width="214" height="118" rx="10"/>
  <circle class="badgeDone" cx="804" cy="268" r="14"/><text class="badgeText" x="800" y="273">4</text>
  <text class="nodeTitle" x="828" y="273">优化中心线骨架</text>
  <text class="nodeText" x="802" y="303">路口前剪短中心线，</text>
  <text class="nodeText" x="802" y="325">补 T 路口连接线，</text>
  <text class="nodeText" x="802" y="347">生成 413 条线。</text>

  <path class="arrow" d="M 996 304 L 1045 304"/>

  <rect class="done" x="1045" y="245" width="214" height="118" rx="10"/>
  <circle class="badgeDone" cx="1067" cy="268" r="14"/><text class="badgeText" x="1063" y="273">5</text>
  <text class="nodeTitle" x="1091" y="273">路口语义</text>
  <text class="nodeText" x="1065" y="303">识别 T/cross 路口，</text>
  <text class="nodeText" x="1065" y="325">推断直行/左转/右转，</text>
  <text class="nodeText" x="1065" y="347">保留 164 个可通行 movement。</text>

  <path class="arrow" d="M 1259 304 L 1308 304"/>

  <rect class="done" x="1308" y="245" width="252" height="118" rx="10"/>
  <circle class="badgeDone" cx="1330" cy="268" r="14"/><text class="badgeText" x="1326" y="273">6</text>
  <text class="nodeTitle" x="1354" y="273">车道图 lane_graph</text>
  <text class="nodeText" x="1328" y="303">612 条车道中心线。</text>
  <text class="nodeText" x="1328" y="325">253 条 laneLink。</text>
  <text class="nodeText" x="1328" y="347">245 条已吃到优化路口连接线。</text>

  <rect class="panel" x="70" y="392" width="1490" height="90" rx="12"/>
  <text class="nodeTitle" x="92" y="423">这一步目前最关键的进展</text>
  <text class="nodeText" x="92" y="452">之前车道层还在用 road_graph 原始线；现在 612 条车道已经来自 optimized_approach_centerline，路口转向线也主要来自 optimized_junction_connector。</text>
  <text class="code" x="92" y="474">lane_centerline_source_counts = optimized_approach_centerline: 612，laneLink curve source = optimized_junction_connector: 245 + fallback bezier: 8</text>

  <rect class="panel" x="40" y="558" width="1600" height="360" rx="14"/>
  <text class="laneTitle" x="70" y="596">B. Houdini 里：把这些数据变成可看的几何节点</text>
  <text class="small" x="70" y="621">这些是 /obj/road_test_pattaya_central_500m 里会创建或刷新出的主要节点。默认显示中心线，debug 和 surface 节点用于检查。</text>

  <!-- Houdini nodes -->
  <rect class="houdini" x="70" y="665" width="238" height="126" rx="10"/>
  <circle class="badgeDone" cx="92" cy="688" r="14"/><text class="badgeText" x="88" y="693">7</text>
  <text class="nodeTitle" x="116" y="693">导入道路线</text>
  <text class="code" x="90" y="721">python_import_roads_geojson</text>
  <text class="nodeText" x="90" y="749">读 optimized_centerlines.geojson，</text>
  <text class="nodeText" x="90" y="771">在 Houdini 里变成 413 条线。</text>

  <path class="arrow" d="M 308 728 L 365 728"/>

  <rect class="houdini" x="365" y="665" width="238" height="126" rx="10"/>
  <circle class="badgeDone" cx="387" cy="688" r="14"/><text class="badgeText" x="383" y="693">8</text>
  <text class="nodeTitle" x="411" y="693">保留中心线显示</text>
  <text class="code" x="385" y="721">OUT_roads_centerlines</text>
  <text class="nodeText" x="385" y="749">这是最干净的骨架预览。</text>
  <text class="nodeText" x="385" y="771">用于看路口剪线和连接是否顺。</text>

  <path class="softArrow" d="M 603 728 C 654 728 651 664 704 664"/>
  <path class="softArrow" d="M 603 728 C 654 728 651 827 704 827"/>

  <rect class="houdini" x="704" y="606" width="282" height="126" rx="10"/>
  <circle class="badgeDone" cx="726" cy="629" r="14"/><text class="badgeText" x="722" y="634">9</text>
  <text class="nodeTitle" x="750" y="634">车道调试几何</text>
  <text class="code" x="724" y="662">OUT_lane_connections_debug</text>
  <text class="nodeText" x="724" y="690">显示 lane centerline、laneLink 曲线</text>
  <text class="nodeText" x="724" y="712">和窄 ribbon，方便查连接错位。</text>

  <rect class="houdini" x="704" y="770" width="282" height="126" rx="10"/>
  <circle class="badgeDone" cx="726" cy="793" r="14"/><text class="badgeText" x="722" y="798">10</text>
  <text class="nodeTitle" x="750" y="798">车道面 v1</text>
  <text class="code" x="724" y="826">OUT_lane_surfaces_v1</text>
  <text class="nodeText" x="724" y="854">把车道和转向连接膨胀成面。</text>
  <text class="nodeText" x="724" y="876">612 approach + 253 turn + 42 corner。</text>

  <path class="arrow" d="M 986 669 L 1042 669"/>
  <path class="arrow" d="M 986 833 L 1042 833"/>

  <rect class="next" x="1042" y="606" width="250" height="290" rx="10"/>
  <circle class="badgeNext" cx="1064" cy="629" r="14"/><text class="badgeText" x="1058" y="634">11</text>
  <text class="nodeTitle" x="1088" y="634">还没做成正式几何</text>
  <text class="nodeText" x="1062" y="666">现在 surface 还是一条条 ribbon。</text>
  <text class="nodeText" x="1062" y="692">下一步要生成统一路口包络面：</text>
  <text class="nodeText" x="1080" y="724">lane boundaries</text>
  <text class="nodeText" x="1080" y="750">junction envelope</text>
  <text class="nodeText" x="1080" y="776">curb arcs / sidewalks</text>
  <text class="nodeText" x="1080" y="802">traffic islands</text>
  <text class="nodeText" x="1080" y="828">markings</text>
  <text class="nodeText" x="1062" y="860">这才是最终道路外观层。</text>

  <rect class="panel" x="1320" y="606" width="240" height="290" rx="12"/>
  <text class="nodeTitle" x="1340" y="636">如何读这张图</text>
  <rect class="done" x="1340" y="660" width="28" height="18" rx="4"/>
  <text class="nodeText" x="1378" y="675">绿色：当前已跑通</text>
  <rect class="warn" x="1340" y="696" width="28" height="18" rx="4"/>
  <text class="nodeText" x="1378" y="711">黄色：数据质量有限</text>
  <rect class="houdini" x="1340" y="732" width="28" height="18" rx="4"/>
  <text class="nodeText" x="1378" y="747">蓝色：Houdini 节点</text>
  <rect class="next" x="1340" y="768" width="28" height="18" rx="4"/>
  <text class="nodeText" x="1378" y="783">虚线：下一步目标</text>
  <text class="nodeText" x="1340" y="826">通俗讲：</text>
  <text class="nodeText" x="1340" y="850">先修路网，再懂路口，</text>
  <text class="nodeText" x="1340" y="874">再铺车道面，最后做路缘和标线。</text>

  <rect class="panel" x="40" y="950" width="1600" height="176" rx="14"/>
  <text class="laneTitle" x="70" y="988">每一步一句话解释</text>
  <text class="nodeText" x="70" y="1022">1 原始地图道路：从 OSM 拿到真实道路中心线，但它只是“地图线”，不是可直接建模的道路。</text>
  <text class="nodeText" x="70" y="1048">2 拓扑修复：把断开的点、太短的边、路口连接关系整理好，让道路能形成一张图。</text>
  <text class="nodeText" x="70" y="1074">3-5 道路图和路口语义：让系统知道哪里是路口、哪条是主路、哪些转向能走。</text>
  <text class="nodeText" x="70" y="1100">6 车道图：把道路升级成车道，给每条车道和每个转向连接分配 ID 和曲线。</text>
  <text class="nodeText" x="870" y="1022">7-8 Houdini 中心线：先在视口里看最干净的骨架，确认道路没有断裂和乱连。</text>
  <text class="nodeText" x="870" y="1048">9 调试几何：把车道线和 laneLink 画出来，专门检查路口连接是否合理。</text>
  <text class="nodeText" x="870" y="1074">10 车道面 v1：把线膨胀成可看的面，但它还不是最终道路外观。</text>
  <text class="nodeText" x="870" y="1100">11 下一步：做统一路口包络、路缘、人行道、导流岛和标线。</text>
</svg>
