<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="1800" viewBox="0 0 3600 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="houdini" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L16 9 L2 16 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L16 9 L2 16 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L16 9 L2 16 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L16 9 L2 16 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 58px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 26px; fill: #475569; }
      .band-title { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #0f172a; }
      .box-title { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 29px; font-weight: 800; fill: #0f172a; }
      .box-sub { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 21px; fill: #475569; }
      .small { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 18px; fill: #64748b; }
      .tiny { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 16px; fill: #64748b; }
      .tag { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
      .label { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #334155; }
      .note { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 21px; fill: #334155; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 18px; fill: #334155; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.4; rx: 16; filter: url(#shadow); }
      .box-blue { fill: #f8fbff; stroke: #93c5fd; stroke-width: 2.6; rx: 16; filter: url(#shadow); }
      .box-green { fill: #f3fcf8; stroke: #86efac; stroke-width: 2.6; rx: 16; filter: url(#shadow); }
      .box-orange { fill: #fff8f0; stroke: #fdba74; stroke-width: 2.6; rx: 16; filter: url(#shadow); }
      .box-red { fill: #fff5f5; stroke: #fca5a5; stroke-width: 2.6; rx: 16; filter: url(#shadow); }
      .box-gray { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2.4; rx: 16; filter: url(#shadow); }
      .line { fill: none; stroke: #334155; stroke-width: 5; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 6; marker-end: url(#arrowBlue); }
      .line-green { fill: none; stroke: #0f766e; stroke-width: 6; marker-end: url(#arrowGreen); }
      .line-orange { fill: none; stroke: #ea580c; stroke-width: 6; marker-end: url(#arrowOrange); }
      .line-dash { fill: none; stroke: #64748b; stroke-width: 4; stroke-dasharray: 14 12; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #94a3b8; stroke-width: 3; }
    </style>
  </defs>

  <rect width="3600" height="1800" fill="url(#bg)"/>
  <rect x="80" y="70" width="3440" height="1660" rx="34" fill="#ffffff" opacity="0.64" stroke="#dbeafe" stroke-width="2"/>

  <text x="140" y="155" class="title">VirtualCity 当前完整自动化流水线</text>
  <text x="142" y="204" class="subtitle">BBOX 框选 → 同源地图数据清洗 → LaneForge 车道升级 package → Houdini 自动构建 → QA / 导出</text>

  <rect x="140" y="255" width="820" height="78" rx="18" fill="url(#main)" opacity="0.95"/>
  <text x="178" y="305" class="tag">主工程事实源：负责区域、原始数据、清洗发布、总调度</text>

  <rect x="1050" y="255" width="940" height="78" rx="18" fill="url(#lane)" opacity="0.95"/>
  <text x="1088" y="305" class="tag">LaneForge：只吃主工程同一份道路，升级为 Houdini 可消费的车道 package</text>

  <rect x="2090" y="255" width="920" height="78" rx="18" fill="url(#houdini)" opacity="0.95"/>
  <text x="2128" y="305" class="tag">Houdini：读取 active_area 与 package manifest，自动构建城市白模</text>

  <rect x="3090" y="255" width="330" height="78" rx="18" fill="#334155" opacity="0.95"/>
  <text x="3128" y="305" class="tag">QA Gate / Export</text>

  <!-- Main flow boxes -->
  <rect x="145" y="410" width="390" height="190" class="box-blue"/>
  <text x="180" y="465" class="box-title">1. 框选 BBOX</text>
  <text x="180" y="510" class="box-sub">area_picker.py</text>
  <text x="180" y="548" class="small">浏览器中选取固定网格区域</text>
  <text x="180" y="580" class="small">输出 west/south/east/north</text>

  <rect x="650" y="410" width="430" height="190" class="box-blue"/>
  <text x="688" y="465" class="box-title">2. 建立当前区域状态</text>
  <text x="688" y="510" class="box-sub">set_area.py + pipeline_state.py</text>
  <text x="688" y="548" class="small">写入 active_area.json</text>
  <text x="688" y="580" class="small">生成 area_id 与 run_id</text>

  <rect x="1195" y="410" width="455" height="190" class="box-blue"/>
  <text x="1234" y="465" class="box-title">3. 原始数据获取/缓存</text>
  <text x="1234" y="510" class="box-sub">OSM / Buildings / DEM</text>
  <text x="1234" y="548" class="small">道路、建筑、地形都按同一 BBOX</text>
  <text x="1234" y="580" class="small">来自主工程数据流程与缓存</text>

  <rect x="1765" y="410" width="470" height="190" class="box-blue"/>
  <text x="1804" y="465" class="box-title">4. 数据清洗与发布</text>
  <text x="1804" y="510" class="box-sub">refine_data.py</text>
  <text x="1804" y="548" class="small">先写 staging，QA 通过后发布</text>
  <text x="1804" y="580" class="small">成为 Houdini-ready 标准数据包</text>

  <rect x="2365" y="410" width="535" height="190" class="box-green"/>
  <text x="2404" y="465" class="box-title">5. LaneForge Bridge</text>
  <text x="2404" y="510" class="box-sub">build_laneforge_area_package.py</text>
  <text x="2404" y="548" class="small">从 _houdini_ready 读取同源道路</text>
  <text x="2404" y="580" class="small">生成 lane_upgrade_package</text>

  <rect x="3050" y="410" width="380" height="190" class="box-orange"/>
  <text x="3085" y="465" class="box-title">6. Houdini 自动构建</text>
  <text x="3085" y="510" class="box-sub">_recook_new_area.py</text>
  <text x="3085" y="548" class="small">读取 manifest 并选择道路来源</text>
  <text x="3085" y="580" class="small">输出 OUT_city</text>

  <path d="M535 505 H650" class="line-blue"/>
  <path d="M1080 505 H1195" class="line-blue"/>
  <path d="M1650 505 H1765" class="line-blue"/>
  <path d="M2235 505 H2365" class="line-green"/>
  <path d="M2900 505 H3050" class="line-orange"/>

  <!-- Data truth area -->
  <rect x="360" y="720" width="1000" height="340" class="box-gray"/>
  <text x="405" y="775" class="band-title">active_area.json：全流程共享的“当前区域事实”</text>
  <text x="405" y="830" class="note">保存当前 BBOX、area_id、origin、run_id、数据路径、道路来源模式。</text>
  <text x="405" y="875" class="note">后续脚本不重新猜区域，而是围绕这份状态继续执行。</text>
  <rect x="405" y="920" width="875" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="435" y="957" class="mono">Config/active_area.json</text>
  <text x="435" y="990" class="mono">road_source_mode = laneforge_auto / laneforge_required / legacy</text>
  <path d="M865 600 V720" class="line-dash"/>

  <rect x="1515" y="720" width="1110" height="340" class="box-gray"/>
  <text x="1560" y="775" class="band-title">_houdini_ready/{area_id}：主工程发布的标准城市数据包</text>
  <text x="1560" y="830" class="note">这是 LaneForge 与 Houdini 的共同输入边界：数据已经清洗、投影、裁剪并通过基础 QA。</text>
  <rect x="1560" y="875" width="1015" height="137" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1595" y="915" class="mono">RawData/_houdini_ready/{area_id}/</text>
  <text x="1595" y="950" class="mono">buildings.geojson · roads.osm · roads_clean.geojson</text>
  <text x="1595" y="985" class="mono">road_graph.json · dem.csv · meta.json</text>
  <path d="M2000 600 V720" class="line-dash"/>

  <rect x="2750" y="720" width="620" height="340" class="box-green"/>
  <text x="2795" y="775" class="band-title">LaneForge 标准 package</text>
  <text x="2795" y="830" class="note">记录 source_identity，证明 package 来自当前 VirtualCity 区域与当前 run_id。</text>
  <rect x="2795" y="875" width="520" height="137" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="2825" y="915" class="mono">lane_package_v0001/</text>
  <text x="2825" y="950" class="mono">houdini_manifest.json</text>
  <text x="2825" y="985" class="mono">standard_lane_surfaces.geojson</text>
  <path d="M2632 600 C2632 645 3060 645 3060 720" class="line-green"/>

  <path d="M2625 890 H2750" class="line-green"/>
  <text x="2645" y="850" class="label">同源道路升级</text>

  <!-- Houdini internals -->
  <rect x="1510" y="1210" width="585" height="250" class="box-orange"/>
  <text x="1552" y="1265" class="box-title">Houdini 道路来源 Switch</text>
  <text x="1552" y="1310" class="box-sub">由 active_area 控制</text>
  <text x="1552" y="1360" class="small">0 = road_strips</text>
  <text x="1552" y="1393" class="small">1 = road_topology_builder</text>
  <text x="1552" y="1426" class="small">2 = laneforge_lane_surfaces</text>

  <rect x="2240" y="1210" width="510" height="250" class="box-orange"/>
  <text x="2282" y="1265" class="box-title">Package 校验</text>
  <text x="2282" y="1310" class="box-sub">防止旧包/错包进入 Houdini</text>
  <text x="2282" y="1360" class="small">area_id 必须匹配</text>
  <text x="2282" y="1393" class="small">run_id 必须匹配</text>
  <text x="2282" y="1426" class="small">qa_gate_status 不能是 blocker</text>

  <rect x="2890" y="1210" width="470" height="250" class="box-red"/>
  <text x="2932" y="1265" class="box-title">QA / 人工确认 / 导出</text>
  <text x="2932" y="1310" class="box-sub">houdini_model_qa.py</text>
  <text x="2932" y="1360" class="small">写入 houdini_build_status.json</text>
  <text x="2932" y="1393" class="small">确认后 export_and_import.py</text>
  <text x="2932" y="1426" class="small">支持 laneforge_lane_surfaces</text>

  <path d="M3370 890 C3450 890 3470 1120 3125 1210" class="line-orange"/>
  <path d="M2750 1335 H2890" class="line-orange"/>
  <path d="M2095 1335 H2240" class="line-orange"/>

  <!-- fallback path -->
  <path d="M2010 1060 C1880 1115 1805 1155 1805 1210" class="line-dash"/>
  <text x="1590" y="1138" class="label">LaneForge 失败或未通过时可回退 legacy roads</text>

  <!-- LaneForge standalone entrance -->
  <rect x="1050" y="1210" width="330" height="250" class="box-green"/>
  <text x="1088" y="1265" class="box-title">保留 LaneForge 入口</text>
  <text x="1088" y="1310" class="box-sub">独立预览 / 审查 / 重建</text>
  <text x="1088" y="1360" class="small">不重新决定 BBOX</text>
  <text x="1088" y="1393" class="small">不独立下载道路</text>
  <text x="1088" y="1426" class="small">回写同一区域 package</text>
  <path d="M3060 1060 C3060 1145 1380 1145 1380 1265" class="line-green"/>
  <path d="M1380 1370 H1510" class="line-green"/>

  <!-- Bottom principle -->
  <rect x="220" y="1570" width="3160" height="92" rx="22" fill="#0f172a"/>
  <text x="280" y="1627" class="tag">核心原则：主工程负责“同一片城市的事实源”，LaneForge 只把这份道路升级为高质量车道；Houdini 只消费已校验的标准 package。</text>

  <!-- Number badges -->
  <circle cx="155" cy="420" r="26" fill="#2563eb"/><text x="147" y="429" class="tag">1</text>
  <circle cx="660" cy="420" r="26" fill="#2563eb"/><text x="652" y="429" class="tag">2</text>
  <circle cx="1205" cy="420" r="26" fill="#2563eb"/><text x="1197" y="429" class="tag">3</text>
  <circle cx="1775" cy="420" r="26" fill="#2563eb"/><text x="1767" y="429" class="tag">4</text>
  <circle cx="2375" cy="420" r="26" fill="#0f766e"/><text x="2367" y="429" class="tag">5</text>
  <circle cx="3060" cy="420" r="26" fill="#ea580c"/><text x="3052" y="429" class="tag">6</text>

  <!-- Legend -->
  <rect x="140" y="1688" width="1140" height="30" rx="15" fill="#dbeafe"/>
  <rect x="140" y="1688" width="310" height="30" rx="15" fill="#2563eb"/>
  <rect x="450" y="1688" width="330" height="30" fill="#0f766e"/>
  <rect x="780" y="1688" width="300" height="30" fill="#ea580c"/>
  <rect x="1080" y="1688" width="200" height="30" rx="15" fill="#ef4444"/>
  <text x="150" y="1713" class="tiny" fill="#ffffff">主工程</text>
  <text x="460" y="1713" class="tiny" fill="#ffffff">LaneForge</text>
  <text x="790" y="1713" class="tiny" fill="#ffffff">Houdini</text>
  <text x="1090" y="1713" class="tiny" fill="#ffffff">QA/导出</text>
</svg>
