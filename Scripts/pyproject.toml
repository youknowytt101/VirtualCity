[project]
name = "worldbuilder"
version = "0.1.0"
description = "Automation pipeline for GIS data, Houdini city generation, QA, and UE5 import support."
requires-python = ">=3.10"
dependencies = [
    "earthengine-api>=1.0.0",
    "numpy>=1.26.0",
    "overturemaps>=1.0.0",
    "pillow>=10.0.0",
    "pywebview>=5.0",
    "rasterio>=1.3.8",
    "rpyc==4.1.0",
    "shapely>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "playwright>=1.61.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
