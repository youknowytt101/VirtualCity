<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">VirtualCity 道路系统双路线总览</title>
  <desc id="desc">展示 OSM 真实数据驱动路线、CityEngine 程序化生成路线，以及二者共用的 road_graph 到 Houdini 道路素模后端。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2F6FED"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#C87900"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#178A5A"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#607080"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102030" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #F6F8FB; }
      .panel { fill: #FFFFFF; stroke: #D8E0EA; stroke-width: 1.5; rx: 8; filter: url(#softShadow); }
      .panel-blue { fill: #F4F8FF; stroke: #B9CEF7; stroke-width: 1.5; rx: 8; }
      .panel-amber { fill: #FFF7E8; stroke: #E7C47B; stroke-width: 1.5; rx: 8; }
      .panel-green { fill: #F0FAF5; stroke: #9ED8BD; stroke-width: 1.5; rx: 8; }
      .panel-violet { fill: #F8F5FF; stroke: #CBBDF2; stroke-width: 1.5; rx: 8; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #142033; }
      .subtitle { font: 400 17px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #526070; }
      .section { font: 700 21px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #172033; }
      .label { font: 700 17px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #1B2738; }
      .small { font: 400 14px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #4B5B6A; }
      .tiny { font: 400 12px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #607080; }
      .mono { font: 600 13px Consolas, "Microsoft YaHei", monospace; fill: #263548; }
      .badge { font: 700 12px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #FFFFFF; }
      .blue { fill: #2F6FED; }
      .amber { fill: #C87900; }
      .green { fill: #178A5A; }
      .violet { fill: #7A55C7; }
      .gray { fill: #607080; }
      .line-blue { fill: none; stroke: #2F6FED; stroke-width: 3; marker-end: url(#arrowBlue); }
      .line-amber { fill: none; stroke: #C87900; stroke-width: 3; marker-end: url(#arrowAmber); }
      .line-green { fill: none; stroke: #178A5A; stroke-width: 3; marker-end: url(#arrowGreen); }
      .line-gray { fill: none; stroke: #607080; stroke-width: 2.5; marker-end: url(#arrowGray); }
      .dash { stroke-dasharray: 7 7; }
      .road { fill: none; stroke: #333E4A; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
      .road-edge { fill: none; stroke: #F7C948; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 10 10; opacity: 0.95; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="title" x="70" y="70">VirtualCity 道路系统双路线总览</text>
  <text class="subtitle" x="72" y="103">路线 A 负责真实 OSM / 付费 API 数据落地，路线 B 负责 CityEngine 风格程序化生长；两者在 road_graph.json 后共用 Houdini 素模后端。</text>

  <rect class="panel" x="60" y="130" width="1480" height="800"/>

  <!-- Route A -->
  <rect class="panel-blue" x="95" y="180" width="640" height="305"/>
  <circle class="blue" cx="125" cy="214" r="16"/>
  <text class="badge" x="120" y="219">A</text>
  <text class="section" x="155" y="220">真实数据驱动路线：当前 MVP 主线</text>
  <text class="small" x="155" y="248">早期免费 API 跑通，成熟后换 TomTom / HERE / Mapbox 等付费 Provider。</text>

  <rect class="panel" x="130" y="285" width="170" height="82"/>
  <text class="label" x="155" y="313">DataProvider</text>
  <text class="small" x="155" y="338">OSMnx / Overpass</text>
  <text class="small" x="155" y="358">TomTom / HERE</text>

  <rect class="panel" x="335" y="285" width="170" height="82"/>
  <text class="label" x="367" y="313">roads_raw</text>
  <text class="mono" x="363" y="338">.geojson</text>
  <text class="small" x="355" y="358">WGS84 + 原始字段</text>

  <rect class="panel" x="540" y="285" width="160" height="82"/>
  <text class="label" x="572" y="313">clean</text>
  <text class="mono" x="562" y="338">pipeline.py</text>
  <text class="small" x="560" y="358">字段 + 投影 + QA</text>

  <path class="line-blue" d="M300,326 L332,326"/>
  <path class="line-blue" d="M505,326 L537,326"/>

  <rect class="panel" x="160" y="390" width="250" height="64"/>
  <text class="label" x="185" y="416">缓存层</text>
  <text class="small" x="185" y="439">raw / processed 按 area、bbox、provider、hash 版本化</text>

  <rect class="panel" x="455" y="390" width="215" height="64"/>
  <text class="label" x="480" y="416">质量报告</text>
  <text class="mono" x="480" y="439">pipeline_report.json</text>

  <path class="line-gray dash" d="M215,368 L235,390"/>
  <path class="line-gray dash" d="M620,368 L585,390"/>

  <!-- Route B -->
  <rect class="panel-amber" x="95" y="540" width="640" height="250"/>
  <circle class="amber" cx="125" cy="574" r="16"/>
  <text class="badge" x="120" y="579">B</text>
  <text class="section" x="155" y="580">程序化生成路线：可延后实现</text>
  <text class="small" x="155" y="608">用于无真实数据或自生成街网场景，不是 OSM 真实城市素模的前置条件。</text>

  <rect class="panel" x="130" y="645" width="158" height="82"/>
  <text class="label" x="156" y="673">Seeds</text>
  <text class="small" x="151" y="698">bounds / density</text>
  <text class="small" x="151" y="718">obstacles</text>

  <rect class="panel" x="325" y="645" width="170" height="82"/>
  <text class="label" x="350" y="673">Priority Queue</text>
  <text class="small" x="350" y="698">Global Goals</text>
  <text class="small" x="350" y="718">major / minor</text>

  <rect class="panel" x="535" y="645" width="165" height="82"/>
  <text class="label" x="560" y="673">Constraints</text>
  <text class="small" x="558" y="698">事务式 plan</text>
  <text class="small" x="558" y="718">snap / split / angle</text>

  <path class="line-amber" d="M288,686 L322,686"/>
  <path class="line-amber" d="M495,686 L532,686"/>

  <!-- Shared graph contract -->
  <rect class="panel-green" x="800" y="365" width="280" height="180"/>
  <circle class="green" cx="834" cy="402" r="16"/>
  <text class="badge" x="828" y="407">C</text>
  <text class="section" x="865" y="407">统一中间契约</text>
  <rect x="845" y="435" width="190" height="55" rx="8" fill="#FFFFFF" stroke="#8FCFB1" stroke-width="1.5"/>
  <text class="label" x="884" y="459">road_graph</text>
  <text class="mono" x="900" y="482">.json</text>
  <text class="small" x="835" y="520">nodes / edges / topology / width / lanes / seg_id</text>

  <path class="line-blue" d="M700,326 C760,326 750,440 800,440"/>
  <path class="line-amber" d="M700,686 C760,686 750,490 800,490"/>

  <!-- Shared Houdini backend -->
  <rect class="panel-green" x="1140" y="180" width="335" height="610"/>
  <circle class="green" cx="1175" cy="214" r="16"/>
  <text class="badge" x="1169" y="219">D</text>
  <text class="section" x="1206" y="220">共用 Houdini 素模后端</text>
  <text class="small" x="1206" y="248">不关心道路来自真实数据还是程序化生成。</text>

  <rect class="panel" x="1180" y="285" width="255" height="72"/>
  <text class="label" x="1210" y="313">HDA 参数化导入</text>
  <text class="mono" x="1210" y="338">geojson_path / road_graph_path</text>

  <rect class="panel" x="1180" y="392" width="255" height="96"/>
  <text class="label" x="1210" y="420">road_surface_builder</text>
  <text class="small" x="1210" y="445">端点 graph + clip margin</text>
  <text class="small" x="1210" y="467">corridor quads + Junction Fan</text>

  <rect class="panel" x="1180" y="525" width="255" height="86"/>
  <text class="label" x="1210" y="553">后处理</text>
  <text class="small" x="1210" y="578">resample 只在道路面之后</text>
  <text class="small" x="1210" y="598">drape / normals / material groups</text>

  <rect class="panel" x="1180" y="650" width="255" height="82"/>
  <text class="label" x="1210" y="678">输出</text>
  <text class="mono" x="1210" y="703">OUT_roads / OUT_curb</text>
  <text class="small" x="1210" y="723">OUT_street_complete</text>

  <path class="line-green" d="M1080,455 C1110,455 1110,321 1177,321"/>
  <path class="line-green" d="M1308,357 L1308,389"/>
  <path class="line-green" d="M1308,488 L1308,522"/>
  <path class="line-green" d="M1308,611 L1308,647"/>

  <!-- Junction fan mini illustration -->
  <rect class="panel-violet" x="800" y="600" width="280" height="190"/>
  <circle class="violet" cx="834" cy="635" r="16"/>
  <text class="badge" x="828" y="640">E</text>
  <text class="section" x="865" y="641">路口核心算法</text>
  <text class="small" x="835" y="670">Junction Fan 是精致素模关键。</text>

  <g transform="translate(843 697)">
    <path class="road" d="M0,40 L190,40"/>
    <path class="road" d="M95,-35 L95,115"/>
    <path class="road" d="M35,100 L95,40"/>
    <polygon points="70,15 120,15 143,40 120,65 70,65 47,40" fill="#46515D"/>
    <path class="road-edge" d="M0,25 L190,25"/>
    <path class="road-edge" d="M0,55 L190,55"/>
    <circle cx="95" cy="40" r="4" fill="#F7C948"/>
  </g>
  <text class="tiny" x="833" y="765">按 incident edge 角度排序，收集左右边界点，生成无缝路口面。</text>

  <!-- Milestones -->
  <rect class="panel" x="95" y="835" width="1380" height="60"/>
  <text class="label" x="125" y="863">实施优先级</text>
  <text class="small" x="245" y="863">立即：Provider 契约 + road_surface_builder 主线</text>
  <text class="small" x="615" y="863">跑通后：缓存、报告、HDA 路径参数化</text>
  <text class="small" x="1010" y="863">可推迟：CityEngine Priority Queue 生长</text>

  <text class="tiny" x="72" y="962">来源文档：01_CityEngine道路生成逻辑复刻指南.md；02_OSM到Houdini道路素模工作流.md</text>
</svg>
